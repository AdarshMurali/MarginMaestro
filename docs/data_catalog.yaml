# MarginMaestro data catalog (MM-135, ADR-0015) -- the source of truth.
#
# Every Cloud SQL table and every GCS document family, with its owner,
# description, classification, freshness expectation and source. Three uses:
#
# 1. Dataplex Universal Catalog: infra/gcp/dataplex.tf reads this file and
#    registers one custom entry per table / document family, each carrying the
#    "marginmaestro-governance" aspect (owner, class, freshness, source).
# 2. The LLM data-class filter (src/governance/classification.py): every
#    `confidential` column declares how it is handled before text reaches a
#    model (`llm`), and the filter applies it.
# 3. tests/unit/test_data_catalog.py fails if a SQLAlchemy table, a column or a
#    document family is missing here (or listed here but gone from the code).
#
# Classes (lowest to highest): public < internal < confidential. A table's class
# is at least the highest class of its columns.
#
# `llm` (confidential columns only; public/internal data passes unchanged):
#   pseudonymize -- replaced by the row's `pseudonym` column before the model
#                   sees it (e.g. a counterparty's legal name -> CP-3); free
#                   text that `contains` such a column is pseudonymized the same way
#   mask         -- replaced by [CONFIDENTIAL] when the field is sent to a model
#   deny         -- must never be sent; a prompt that contains it is blocked
#                   (`pattern` is how the filter recognises it in free text)
#
# Freshness is the expectation, not a measured SLA. Data is synthetic except
# market data (yfinance, FRED), which is real.

version: 1

tables:
  counterparties:
    owner: margin-operations
    description: Counterparty master -- legal name, type, country and service tier.
    class: confidential
    freshness: Reference data; changes only when the book is re-seeded.
    source: Synthetic (persistence.generators.counterparties, faker, seed 42).
    columns:
      id: {class: internal}
      name: {class: confidential, llm: pseudonymize, pseudonym: id}
      type: {class: internal}
      country: {class: internal}
      tier: {class: internal}

  portfolios:
    owner: margin-operations
    description: One portfolio per counterparty, with its base currency.
    class: internal
    freshness: Reference data; changes only when the book is re-seeded.
    source: Synthetic (persistence.generators.portfolios).
    columns:
      id: {class: internal}
      counterparty_id: {class: internal}
      currency: {class: internal}

  positions:
    owner: margin-operations
    description: Trade positions per portfolio -- the book the exposure is computed on.
    class: confidential
    freshness: Reference data; changes only when the book is re-seeded.
    source: Synthetic (persistence.generators.portfolios) over real tickers (MARKET_UNIVERSE).
    columns:
      id: {class: internal}
      portfolio_id: {class: internal}
      ticker: {class: public}
      asset_class: {class: internal}
      quantity: {class: confidential, llm: mask}
      trade_date: {class: internal}

  ratings:
    owner: credit-risk
    description: Counterparty credit-rating history (drives CSA rating triggers).
    class: internal
    freshness: Reference data; changes only when the book is re-seeded.
    source: Synthetic (persistence.generators.ratings).
    columns:
      id: {class: internal}
      counterparty_id: {class: internal}
      grade: {class: internal}
      rating_date: {class: internal}

  collateral_items:
    owner: collateral-management
    description: Collateral held per counterparty, with value and haircut.
    class: confidential
    freshness: Reference data; changes only when the book is re-seeded.
    source: Synthetic (persistence.generators.collateral, calibrated to each book).
    columns:
      id: {class: internal}
      counterparty_id: {class: internal}
      collateral_type: {class: internal}
      ticker: {class: public}
      value_usd: {class: confidential, llm: mask}
      haircut_pct: {class: internal}

  audit_log:
    owner: compliance
    description: Append-only audit trail of every margin-call lifecycle step (UPDATE/DELETE revoked from mm_app).
    class: confidential
    freshness: Written in real time by every orchestrator step.
    source: Application (persistence.audit.record_audit_event).
    columns:
      id: {class: internal}
      correlation_id: {class: internal}
      counterparty_id: {class: internal}
      event_type: {class: internal}
      payload: {class: confidential, llm: deny}
      created_at: {class: internal}

  processed_events:
    owner: platform-engineering
    description: Idempotency claims -- an event, status or post recorded here was already handled.
    class: internal
    freshness: Written in real time.
    source: Application (event agent, webhook, internal notifications).
    columns:
      event_id: {class: internal}
      processed_at: {class: internal}

  price_history:
    owner: market-data
    description: Daily end-of-day close per ticker.
    class: public
    freshness: Daily, after the 16:30 New York EOD job (Mon-Fri).
    source: Real market data (yfinance).
    columns:
      ticker: {class: public}
      price_date: {class: public}
      price: {class: public}
      currency: {class: public}
      source: {class: public}

  latest_prices:
    owner: market-data
    description: Most recent price per ticker (read by /exposure and the price chart).
    class: public
    freshness: Every 5 minutes during New York market hours (price-refresh job).
    source: Real market data (yfinance).
    columns:
      ticker: {class: public}
      price: {class: public}
      currency: {class: public}
      source: {class: public}
      as_of: {class: public}
      updated_at: {class: public}

  reference_rates:
    owner: market-data
    description: Daily FRED reference rates, yields and the VIX (initial-margin input).
    class: public
    freshness: Daily, with the EOD job.
    source: Real market data (FRED).
    columns:
      series_id: {class: public}
      rate_date: {class: public}
      value: {class: public}

  orchestrator_checkpoints:
    owner: platform-engineering
    description: LangGraph checkpoints -- a paused margin call (exposure, call amount, approval state) survives a restart.
    class: confidential
    freshness: Written in real time at every orchestrator step.
    source: Application (persistence.db.checkpoint_saver).
    columns:
      thread_id: {class: internal}
      checkpoint_ns: {class: internal}
      checkpoint_id: {class: internal}
      parent_checkpoint_id: {class: internal}
      checkpoint_type: {class: internal}
      checkpoint_blob: {class: confidential, llm: deny}
      metadata_type: {class: internal}
      metadata_blob: {class: confidential, llm: deny}
      created_at: {class: internal}

  orchestrator_checkpoint_writes:
    owner: platform-engineering
    description: Pending writes for an orchestrator checkpoint.
    class: confidential
    freshness: Written in real time at every orchestrator step.
    source: Application (persistence.db.checkpoint_saver).
    columns:
      thread_id: {class: internal}
      checkpoint_ns: {class: internal}
      checkpoint_id: {class: internal}
      task_id: {class: internal}
      idx: {class: internal}
      channel: {class: internal}
      write_type: {class: internal}
      write_blob: {class: confidential, llm: deny}
      task_path: {class: internal}

  tickets:
    owner: margin-operations
    description: Escalation tickets (ServiceNow incident references).
    class: internal
    freshness: Written when a call escalates.
    source: Application (agents.escalation).
    columns:
      id: {class: internal}
      counterparty_id: {class: internal}
      status: {class: internal}
      external_ref: {class: internal}
      created_at: {class: internal}
      resolved_at: {class: internal}

  users:
    owner: platform-engineering
    description: Demo logins and their roles.
    class: confidential
    freshness: Seeded once; changes only on re-seed.
    source: Application (persistence.seed_users; bcrypt hashes).
    columns:
      username: {class: internal}
      password_hash:
        class: confidential
        llm: deny
        pattern: '\$2[aby]\$\d{2}\$[./A-Za-z0-9]{53}'
      role: {class: internal}

  user_counterparty_access:
    owner: platform-engineering
    description: Which counterparties a scoped user (margin analyst) may see -- the row-level security source.
    class: internal
    freshness: Seeded once; changes when coverage changes.
    source: Application (persistence.seed_users).
    columns:
      username: {class: internal}
      counterparty_id: {class: internal}

  counterparty_contacts:
    owner: margin-operations
    description: Who receives a counterparty's client notices (MM-143) -- one WhatsApp contact per counterparty; counterparties without one use the WHATSAPP_RECIPIENT default.
    class: confidential
    freshness: Changes only when an admin runs python -m persistence.contacts.
    source: Application (persistence.contacts admin CLI; numbers read from a hidden prompt).
    columns:
      id: {class: internal}
      counterparty_id: {class: internal}
      contact_name: {class: confidential, llm: deny}
      channel: {class: internal}
      phone_e164:
        class: confidential
        llm: deny
        pattern: '\+[1-9]\d{7,14}\b'
      active: {class: internal}
      updated_at: {class: internal}

  rag_chunks:
    owner: margin-operations
    description: Embedded document chunks for RAG (pgvector, Postgres only). A derived, rebuildable index of the GCS documents.
    class: confidential
    freshness: Rebuilt on re-ingestion (python -m rag.ingest).
    source: Derived from the GCS documents bucket (rag.ingest).
    migration_only: true # created by migration d4e1b9c2a7f5, no SQLAlchemy model
    columns:
      id: {class: internal}
      counterparty_id: {class: internal}
      doc_type: {class: internal}
      text: {class: confidential, llm: pseudonymize, contains: [counterparties.name]}
      metadata: {class: internal}
      embedding: {class: internal}

# BigQuery warehouse tables (MM-139, ADR-0013), dataset marginmaestro_analytics.
# Columns must match src/warehouse/schemas.py (test_data_catalog.py). Every
# confidential column carries the `confidential` policy tag (column-level
# masking, infra/gcp/bigquery.tf). No warehouse data is sent to an LLM; `llm`
# is declared to satisfy the catalog's rule and says how it would be handled.
warehouse_tables:
  fact_daily_exposure:
    owner: margin-operations
    description: "Counterparty x trading day: exposure (VM + IM), collateral, CSA threshold/MTA, headroom and the call due -- all computed by the calc engine."
    class: confidential
    freshness: "Daily: the live book after the 16:45 New York margin run; the simulated book once, by backfill."
    source: Calc engine over real closes; live book from Cloud SQL (warehouse.live_load), simulated book from warehouse.backfill.
    columns:
      as_of_date: {class: internal}
      book: {class: internal}
      counterparty_id: {class: internal}
      csa_version: {class: internal}
      rating: {class: internal}
      vix: {class: internal}
      variation_margin: {class: internal}
      initial_margin: {class: internal}
      exposure: {class: internal}
      threshold: {class: internal}
      mta: {class: internal}
      collateral_held: {class: confidential, llm: mask}
      required_support: {class: internal}
      headroom: {class: confidential, llm: mask}
      call_due: {class: internal}
      breached: {class: internal}
      call_raised: {class: internal}
      currency: {class: internal}

  fact_position_daily:
    owner: margin-operations
    description: "Position x trading day: quantity, close and market value."
    class: confidential
    freshness: Daily (live); once by backfill (simulated, ~63M rows).
    source: Positions (synthetic) x real closes (Yahoo Finance).
    columns:
      as_of_date: {class: internal}
      book: {class: internal}
      counterparty_id: {class: internal}
      position_id: {class: internal}
      ticker: {class: internal}
      asset_class: {class: internal}
      quantity: {class: confidential, llm: mask}
      close: {class: internal}
      market_value: {class: confidential, llm: mask}

  fact_margin_call:
    owner: margin-operations
    description: One row per margin call raised, with its lifecycle timestamps and outcome.
    class: confidential
    freshness: Daily, re-loading the trailing 14 days of live calls; once by backfill (simulated).
    source: Orchestrator checkpoints + audit_log (live); warehouse.backfill (simulated, synthetic lifecycle times).
    columns:
      raised_date: {class: internal}
      book: {class: internal}
      call_id: {class: internal}
      counterparty_id: {class: internal}
      trigger_type: {class: internal}
      call_amount: {class: internal}
      currency: {class: internal}
      rationale: {class: confidential, llm: mask}
      raised_at: {class: internal}
      approval_decision: {class: internal}
      approved_at: {class: internal}
      approver: {class: internal}
      manager_approved_at: {class: internal}
      notified_at: {class: internal}
      channel: {class: internal}
      acknowledged_at: {class: internal}
      escalated_at: {class: internal}
      sla_outcome: {class: internal}
      status: {class: internal}

  fact_price_daily:
    owner: market-data
    description: "Symbol x trading day: real daily closes (Yahoo Finance) and FRED reference rates."
    class: public
    freshness: Daily (live); once by backfill (simulated).
    source: Real market data (Yahoo Finance, FRED).
    columns:
      price_date: {class: public}
      book: {class: public}
      symbol: {class: public}
      kind: {class: public}
      value: {class: public}
      source: {class: public}

  dim_counterparty:
    owner: margin-operations
    description: Counterparties of both books (simulated names are clearly synthetic).
    class: confidential
    freshness: Daily (live); once by backfill (simulated).
    source: Cloud SQL counterparties (live); warehouse.simulated_book (synthetic SIM names).
    columns:
      book_key: {class: internal}
      book: {class: internal}
      counterparty_id: {class: internal}
      name: {class: confidential, llm: pseudonymize, pseudonym: counterparty_id}
      type: {class: internal}
      country: {class: internal}
      tier: {class: internal}
      rating: {class: internal}

  dim_instrument:
    owner: market-data
    description: Instruments held by each book, with GICS sector from the S&P 500 snapshot.
    class: public
    freshness: Daily (live); once by backfill (simulated).
    source: S&P 500 snapshot (Wikipedia) + the live universe.
    columns:
      book_key: {class: public}
      book: {class: public}
      ticker: {class: public}
      security: {class: public}
      asset_class: {class: public}
      sector: {class: public}
      sub_industry: {class: public}
      in_sp500: {class: public}

  dim_csa_terms:
    owner: legal
    description: CSA terms per counterparty, SCD type 2 (valid_from / valid_to).
    class: internal
    freshness: "Daily (live: SCD2 versions of the CSA terms the orchestrator extracted); once by backfill (simulated)."
    source: "Orchestrator checkpoints (live); warehouse.simulated_book (simulated: structured terms, not documents)."
    columns:
      book_key: {class: internal}
      book: {class: internal}
      counterparty_id: {class: internal}
      csa_version: {class: internal}
      valid_from: {class: internal}
      valid_to: {class: internal}
      is_current: {class: internal}
      threshold: {class: internal}
      mta: {class: internal}
      currency: {class: internal}
      trigger_below_grade: {class: internal}
      trigger_threshold: {class: internal}
      haircut_cash: {class: internal}
      haircut_treasury: {class: internal}
      haircut_corporate: {class: internal}
      haircut_mmf: {class: internal}
      change_reason: {class: internal}

  dim_date:
    owner: platform-engineering
    description: "Shared calendar (no book): one row per day, 2021-2030."
    class: public
    freshness: Static calendar 2021-2030, written by the backfill.
    source: Generated (warehouse.dims).
    columns:
      date_key: {class: public}
      year: {class: public}
      quarter: {class: public}
      month: {class: public}
      day_of_week: {class: public}
      is_weekday: {class: public}
      is_month_end: {class: public}
      year_quarter: {class: public}
      year_month: {class: public}

  rpt_counterparty_daily:
    owner: risk-management
    description: "Reports 1, 2, 5: exposure, headroom, collateral adequacy and calls per day."
    class: confidential
    freshness: Refreshed after every load (warehouse/sql/refresh_rpt_counterparty_daily.sql).
    source: fact_daily_exposure + dim_counterparty.
    columns:
      as_of_date: {class: internal}
      book: {class: internal}
      counterparty_id: {class: internal}
      tier: {class: internal}
      exposure: {class: internal}
      threshold: {class: internal}
      headroom: {class: confidential, llm: mask}
      required_support: {class: internal}
      collateral_held: {class: confidential, llm: mask}
      coverage_ratio: {class: confidential, llm: mask}
      breached: {class: internal}
      call_raised: {class: internal}
      call_due: {class: internal}
      vix: {class: internal}

  rpt_concentration:
    owner: risk-management
    description: "Report 3: month-end gross/net market value by counterparty, ticker and sector."
    class: confidential
    freshness: Refreshed after every load; one month-end snapshot per month.
    source: fact_position_daily + dim_instrument.
    columns:
      month_start: {class: internal}
      as_of_date: {class: internal}
      book: {class: internal}
      counterparty_id: {class: internal}
      ticker: {class: internal}
      sector: {class: internal}
      asset_class: {class: internal}
      gross_market_value: {class: confidential, llm: mask}
      net_market_value: {class: confidential, llm: mask}

  rpt_margin_call:
    owner: risk-management
    description: "Report 4: one row per call with approval turnaround and SLA result."
    class: internal
    freshness: Refreshed after every load.
    source: fact_margin_call + dim_counterparty.
    columns:
      raised_date: {class: internal}
      book: {class: internal}
      call_id: {class: internal}
      counterparty_id: {class: internal}
      tier: {class: internal}
      trigger_type: {class: internal}
      call_amount: {class: internal}
      approval_minutes: {class: internal}
      notify_minutes: {class: internal}
      sla_outcome: {class: internal}
      escalated: {class: internal}
      status: {class: internal}

# GCS documents bucket (`<project>-documents`), one family per top-level folder.
documents:
  csa:
    owner: legal
    description: Credit Support Annexes, one per counterparty -- threshold, MTA, eligible collateral, haircuts, rating triggers.
    class: confidential
    freshness: On change (a new CSA or an amendment).
    source: Synthetic (rag.csa_corpus), uploaded with python -m rag.gcs_documents.
    contains: [counterparties.name]
  policy:
    owner: risk-management
    description: The firm's margin policy.
    class: internal
    freshness: On change; reviewed yearly.
    source: Synthetic, hand-written.
    contains: []
  disputes:
    owner: margin-operations
    description: Historical dispute notes (precedent for the reconciliation agent).
    class: confidential
    freshness: Append-only; a note per resolved dispute.
    source: Synthetic, hand-written.
    contains: [counterparties.name]
  exceptions:
    owner: margin-operations
    description: Exception rules for reconciliation breaks.
    class: internal
    freshness: On change; reviewed yearly.
    source: Synthetic, hand-written.
    contains: []
  escalation:
    owner: margin-operations
    description: Escalation procedures used when an SLA is breached.
    class: internal
    freshness: On change; reviewed yearly.
    source: Synthetic, hand-written.
    contains: []

# Paths where confidential data reaches a model on purpose. Each one is a
# decision recorded in ADR-0015 (amendment 2026-10-05), not a gap.
llm_exceptions:
  - path: desk_assistant.margin_status
    fields: [orchestrator_checkpoints.checkpoint_blob]
    exposes: Call amount, status and rationale of calls in the asking analyst's own scope (row-level security).
    reason: Answering "what is CP-3's call?" is the assistant's job. The amount comes from code, rounded, and the model is told to quote it, never recompute it; legal names are still pseudonymized and other books stay invisible.
