<text x="120.0" y="745.0" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#3a3a3a">Every step above is written to an immutable audit log, keyed by the run's correlation id — not skippable, not an agent decision.</text>
