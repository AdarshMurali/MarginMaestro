# Auto-loads every dashboard JSON under /var/lib/grafana/dashboards (mounted
# from infra/grafana/dashboards/ in docker-compose.yml) -- no manual import.
apiVersion: 1

providers:
  - name: MarginMaestro
    orgId: 1
    folder: ""
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
