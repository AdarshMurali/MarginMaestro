name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check .
          black --check .
          mypy src

      - name: Test with coverage
        run: pytest --cov=src --cov-report=xml --cov-report=term

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage-xml
          path: coverage.xml

  build-and-push:
    needs: lint-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: docker/setup-buildx-action@v4.2.0

      - name: Debug secret shape (lengths/flags only, no content)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          echo "username length: ${#DOCKER_USERNAME}"
          echo "token length: ${#DOCKERHUB_TOKEN}"
          for name in DOCKER_USERNAME DOCKERHUB_TOKEN; do
            val="${!name}"
            case "$val" in
              *$'\n'*) echo "$name contains newline: true" ;;
              *) echo "$name contains newline: false" ;;
            esac
            case "$val" in
              *$'\r'*) echo "$name contains carriage-return: true" ;;
              *) echo "$name contains carriage-return: false" ;;
            esac
            case "$val" in
              '"'*|*'"') echo "$name has leading/trailing double-quote: true" ;;
              *) echo "$name has leading/trailing double-quote: false" ;;
            esac
            case "$val" in
              ' '*|*' ') echo "$name has leading/trailing space: true" ;;
              *) echo "$name has leading/trailing space: false" ;;
            esac
          done

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4.5.1
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            adarshmurali/marginmaestro:latest
            adarshmurali/marginmaestro:${{ github.sha }}
