name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege for GITHUB_TOKEN: every job only needs to read the repo.
# A job that needs more (e.g. id-token: write for GCP WIF in MM-100) must
# ask for it explicitly at job level.
permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -e ".[dev,data,db,rag,llm,streaming,notify,auth,observability,gcp,gcp-ops]"

      - name: Lint
        run: |
          ruff check .
          black --check .
          mypy src

      - name: Test with coverage
        run: pytest -m "not live" --cov=src --cov-report=xml --cov-report=term

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage-xml
          path: coverage.xml

  # MM-104 (ground rule 6): the one migration chain must stay valid on both
  # SQL Server (AWS / Azure SQL) and Postgres (GCP / Cloud SQL). Runs
  # upgrade -> downgrade -> upgrade against a real server for each dialect.
  migrations:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dialect: postgres
            image: pgvector/pgvector:pg17
            port: 5432
            user: marginmaestro
          - dialect: mssql
            image: mcr.microsoft.com/mssql/server:2022-latest
            port: 1433
            user: sa
    services:
      db:
        image: ${{ matrix.image }}
        env:
          POSTGRES_USER: marginmaestro
          POSTGRES_PASSWORD: CiOnly!Passw0rd
          POSTGRES_DB: marginmaestro
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: CiOnly!Passw0rd
        ports:
          - ${{ matrix.port }}:${{ matrix.port }}
    env:
      APP_ENV: local
      DB_DIALECT: ${{ matrix.dialect }}
      DB_HOST: localhost
      DB_PORT: ${{ matrix.port }}
      DB_NAME: marginmaestro
      DB_USER: ${{ matrix.user }}
      DB_PASSWORD: CiOnly!Passw0rd # throwaway CI container, not a secret
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install ODBC Driver 18 (SQL Server only)
        if: matrix.dialect == 'mssql'
        run: |
          if ! odbcinst -q -d | grep -q "ODBC Driver 18 for SQL Server"; then
            curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | sudo tee /etc/apt/trusted.gpg.d/microsoft.asc >/dev/null
            curl -fsSL "https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/prod.list" | sudo tee /etc/apt/sources.list.d/mssql-release.list >/dev/null
            sudo apt-get update -q
            sudo ACCEPT_EULA=Y apt-get install -y -q msodbcsql18
          fi

      - name: Install dependencies
        # Full set: the RLS suite also drives the API (auth, observability, ...).
        run: pip install -e ".[dev,data,db,rag,llm,streaming,notify,auth,observability,gcp]"

      - name: Wait for the database and create it
        run: |
          for i in $(seq 1 30); do
            python -c "from config.settings import get_settings; from persistence.db.bootstrap import ensure_database_exists; ensure_database_exists(get_settings())" && exit 0
            echo "waiting for ${DB_DIALECT} ($i)"; sleep 5
          done
          exit 1

      - name: Upgrade, downgrade, upgrade
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          alembic current

      # MM-105: approval pauses must survive a restart on both databases --
      # the same checkpoint store code (SqlCheckpointSaver) serves both.
      - name: Checkpoint persistence test
        env:
          REQUIRE_DB: "1"
        run: pytest tests/integration/test_checkpoint_saver_live.py -p no:cacheprovider -v

      # MM-107: row-level security isolation (Postgres-only feature).
      - name: Row-level security isolation tests
        if: matrix.dialect == 'postgres'
        env:
          REQUIRE_DB: "1"
        run: pytest tests/integration/test_rls_live.py -p no:cacheprovider -v

      # MM-110: the pgvector RAG store must meet the same VectorStore contract
      # as Chroma / in-memory, against the migrated rag_chunks table shape.
      - name: pgvector VectorStore contract
        if: matrix.dialect == 'postgres'
        env:
          REQUIRE_DB: "1"
        run: pytest tests/contract/test_vector_store_contract.py -k pgvector -p no:cacheprovider -v

  # MM-119: the Pub/Sub EventBus must meet the same contract as Kafka /
  # in-memory, against the real Pub/Sub emulator (ordering per key included).
  pubsub:
    runs-on: ubuntu-latest
    env:
      PUBSUB_EMULATOR_HOST: localhost:8085
      REQUIRE_PUBSUB: "1"
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Start the Pub/Sub emulator
        run: |
          docker run -d --name pubsub -p 8085:8085 \
            gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators \
            gcloud beta emulators pubsub start --host-port=0.0.0.0:8085 --project=marginmaestro-demo

      - name: Install dependencies
        run: pip install -e ".[dev,data,db,rag,llm,streaming,notify,auth,observability,gcp]"

      - name: Wait for the emulator
        run: |
          for i in $(seq 1 60); do curl -sf http://localhost:8085 && exit 0; sleep 2; done
          docker logs pubsub; exit 1

      - name: EventBus contract + Event Agent on Pub/Sub
        run: pytest tests/contract/test_event_bus_contract.py tests/contract/test_pubsub_worker_emulator.py -m "not live" -p no:cacheprovider -v

  terraform-gcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: "1.15.8"

      - name: Format check
        run: terraform fmt -check -recursive infra/gcp

      # -backend=false: validation needs no GCP credentials or state access.
      - name: Validate
        run: |
          for dir in infra/gcp infra/gcp/bootstrap; do
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
          done

  sonarcloud:
    needs: lint-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8.0.1
        with:
          name: coverage-xml

      - name: SonarQube Cloud Scan
        uses: SonarSource/sonarqube-scan-action@v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: SonarQube Cloud Quality Gate Check
        uses: SonarSource/sonarqube-quality-gate-action@v1.2.0
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  build-and-push:
    needs: lint-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: docker/setup-buildx-action@v4.2.0

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4.5.1
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            adarshmurali/marginmaestro:latest
            adarshmurali/marginmaestro:${{ github.sha }}

  # Continuous deployment to Cloud Run (MM-126, MM-G57): every merge to main
  # deploys the image this run just pushed (tagged with the commit sha), then
  # smoke-tests it. Keyless login as mm-ci-sa via Workload Identity Federation
  # (MM-100); GCP only trusts this repo on main (infra/gcp/wif.tf). mm-ci-sa
  # can deploy this one service and act as mm-api-sa -- nothing else
  # (infra/gcp/cloud_run.tf). Only the image changes; env vars, scaling and
  # the Cloud SQL mount stay as Terraform set them.
  deploy-gcp:
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-gcp
      cancel-in-progress: false # never cut a rollout short; queue the next one
    permissions:
      contents: read
      id-token: write # lets the job request GitHub's OIDC token
    steps:
      - name: Authenticate to GCP (Workload Identity Federation)
        uses: google-github-actions/auth@v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v3.0.1
        with:
          service: marginmaestro-api
          region: us-central1
          project_id: marginmaestro-demo
          image: docker.io/adarshmurali/marginmaestro:${{ github.sha }}

      - name: Smoke test
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          for path in health ready; do
            for attempt in 1 2 3 4 5 6; do
              code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 "$URL/$path") || code=000
              echo "/$path attempt $attempt -> $code"
              [ "$code" = "200" ] && break
              [ "$attempt" = "6" ] && exit 1
              sleep 10
            done
          done
