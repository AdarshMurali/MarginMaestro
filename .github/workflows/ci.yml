name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege for GITHUB_TOKEN: every job only needs to read the repo.
# A job that needs more (e.g. id-token: write for GCP WIF in MM-100) must
# ask for it explicitly at job level.
permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -e ".[dev,data,db,rag,llm,streaming,notify,auth,observability,gcp,gcp-ops,adk]"

      - name: Lint
        run: |
          ruff check .
          black --check .
          mypy src

      - name: Test with coverage
        run: pytest -m "not live" --cov=src --cov-report=xml --cov-report=term

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage-xml
          path: coverage.xml

  # MM-104 (ground rule 6): the one migration chain must stay valid on both
  # SQL Server (AWS / Azure SQL) and Postgres (GCP / Cloud SQL). Runs
  # upgrade -> downgrade -> upgrade against a real server for each dialect.
  migrations:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dialect: postgres
            image: pgvector/pgvector:pg17
            port: 5432
            user: marginmaestro
          - dialect: mssql
            image: mcr.microsoft.com/mssql/server:2022-latest
            port: 1433
            user: sa
    services:
      db:
        image: ${{ matrix.image }}
        env:
          POSTGRES_USER: marginmaestro
          POSTGRES_PASSWORD: CiOnly!Passw0rd
          POSTGRES_DB: marginmaestro
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: CiOnly!Passw0rd
        ports:
          - ${{ matrix.port }}:${{ matrix.port }}
    env:
      APP_ENV: local
      DB_DIALECT: ${{ matrix.dialect }}
      DB_HOST: localhost
      DB_PORT: ${{ matrix.port }}
      DB_NAME: marginmaestro
      DB_USER: ${{ matrix.user }}
      DB_PASSWORD: CiOnly!Passw0rd # throwaway CI container, not a secret
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install ODBC Driver 18 (SQL Server only)
        if: matrix.dialect == 'mssql'
        run: |
          if ! odbcinst -q -d | grep -q "ODBC Driver 18 for SQL Server"; then
            curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | sudo tee /etc/apt/trusted.gpg.d/microsoft.asc >/dev/null
            curl -fsSL "https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/prod.list" | sudo tee /etc/apt/sources.list.d/mssql-release.list >/dev/null
            sudo apt-get update -q
            sudo ACCEPT_EULA=Y apt-get install -y -q msodbcsql18
          fi

      - name: Install dependencies
        # Full set: the RLS suite also drives the API (auth, observability, ...).
        run: pip install -e ".[dev,data,db,rag,llm,streaming,notify,auth,observability,gcp]"

      - name: Wait for the database and create it
        run: |
          for i in $(seq 1 30); do
            python -c "from config.settings import get_settings; from persistence.db.bootstrap import ensure_database_exists; ensure_database_exists(get_settings())" && exit 0
            echo "waiting for ${DB_DIALECT} ($i)"; sleep 5
          done
          exit 1

      - name: Upgrade, downgrade, upgrade
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          alembic current

      # MM-105: approval pauses must survive a restart on both databases --
      # the same checkpoint store code (SqlCheckpointSaver) serves both.
      - name: Checkpoint persistence test
        env:
          REQUIRE_DB: "1"
        run: pytest tests/integration/test_checkpoint_saver_live.py -p no:cacheprovider -v

      # MM-107: row-level security isolation (Postgres-only feature).
      - name: Row-level security isolation tests
        if: matrix.dialect == 'postgres'
        env:
          REQUIRE_DB: "1"
        run: pytest tests/integration/test_rls_live.py -p no:cacheprovider -v

      # MM-137: the audit trail is append-only -- mm_app can insert and read
      # audit_log but not update or delete it (migration e3f8a1c5d927).
      - name: Append-only audit log
        if: matrix.dialect == 'postgres'
        env:
          REQUIRE_DB: "1"
        run: pytest tests/integration/test_audit_append_only_live.py -p no:cacheprovider -v

      # MM-110: the pgvector RAG store must meet the same VectorStore contract
      # as Chroma / in-memory, against the migrated rag_chunks table shape.
      - name: pgvector VectorStore contract
        if: matrix.dialect == 'postgres'
        env:
          REQUIRE_DB: "1"
        run: pytest tests/contract/test_vector_store_contract.py -k pgvector -p no:cacheprovider -v

  # MM-119: the Pub/Sub EventBus must meet the same contract as Kafka /
  # in-memory, against the real Pub/Sub emulator (ordering per key included).
  pubsub:
    runs-on: ubuntu-latest
    env:
      PUBSUB_EMULATOR_HOST: localhost:8085
      REQUIRE_PUBSUB: "1"
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Start the Pub/Sub emulator
        run: |
          docker run -d --name pubsub -p 8085:8085 \
            gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators \
            gcloud beta emulators pubsub start --host-port=0.0.0.0:8085 --project=marginmaestro-demo

      - name: Install dependencies
        run: pip install -e ".[dev,data,db,rag,llm,streaming,notify,auth,observability,gcp]"

      - name: Wait for the emulator
        run: |
          for i in $(seq 1 60); do curl -sf http://localhost:8085 && exit 0; sleep 2; done
          docker logs pubsub; exit 1

      - name: EventBus contract + Event Agent on Pub/Sub
        run: pytest tests/contract/test_event_bus_contract.py tests/contract/test_pubsub_worker_emulator.py -m "not live" -p no:cacheprovider -v

  terraform-gcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: "1.15.8"

      - name: Format check
        run: terraform fmt -check -recursive infra/gcp

      # -backend=false: validation needs no GCP credentials or state access.
      - name: Validate
        run: |
          for dir in infra/gcp infra/gcp/bootstrap; do
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
          done

  # MM-G88 (ADR-0018): free stand-ins for Black Duck / Checkmarx, next to
  # CodeQL, Dependabot and secret scanning (repo settings). Gates fail the
  # job; findings also go to the Security tab as SARIF. Scanner binaries are
  # pinned and checksum-verified (no third-party actions run with this
  # token's security-events scope).
  #   pip-audit  Python deps, fail on a known vuln WITH a fix (ops.security_gates)
  #   licences   allow-list, fail on GPL/AGPL (LGPL and permissive pass)
  #   gitleaks   secrets in the commits of this push / PR
  #   Trivy      image CVEs (fail on fixable CRITICAL), Terraform + Dockerfile misconfig
  #   Checkov    Terraform (infra/gcp); reviewed skips live in .checkov.yaml
  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload SARIF to the Security tab
    env:
      TRIVY_VERSION: "0.75.0"
      GITLEAKS_VERSION: "8.30.1"
      CHECKOV_VERSION: "3.3.23"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans this push's / PR's commits

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install scanners (pinned, checksum-verified)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP"
          base=https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}
          curl -sSfLO "$base/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -sSfLO "$base/trivy_${TRIVY_VERSION}_checksums.txt"
          grep " trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz$" "trivy_${TRIVY_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" -C bin trivy
          base=https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}
          curl -sSfLO "$base/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -C bin gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Gitleaks (secrets in this push / PR)
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          range="$BASE..$HEAD"
          # A new branch / first push has no usable "before": scan the head commit.
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then range="$HEAD~1..$HEAD"; fi
          echo "scanning $range"
          gitleaks git --log-opts="$range" --config .gitleaks.toml --redact --no-banner \
            --report-format sarif --report-path gitleaks.sarif --exit-code 1

      # The image's own dependency set (Dockerfile extras), freshly resolved --
      # pyproject.toml is unpinned, so this is what the next build would ship.
      - name: Install the app's runtime dependencies
        if: always()
        run: pip install ".[db,llm,streaming,rag,aws,gcp,data,notify,auth,observability]" pip-audit pip-licenses

      - name: pip-audit (fail on fixable vulnerabilities)
        if: always()
        run: |
          pip-audit -f json -o pip-audit.json --skip-editable --progress-spinner off || true
          PYTHONPATH=src python -m ops.security_gates pip-audit pip-audit.json

      - name: Licence allow-list (fail on GPL/AGPL)
        if: always()
        run: |
          pip-licenses --from=mixed --format=json --output-file licences.json
          PYTHONPATH=src python -m ops.security_gates licences licences.json

      - name: Trivy -- Terraform and Dockerfile misconfiguration
        if: always()
        run: |
          trivy config --quiet --ignorefile .trivyignore --severity HIGH,CRITICAL \
            --format sarif --output trivy-config.sarif infra/gcp
          trivy config --quiet --ignorefile .trivyignore --severity HIGH,CRITICAL \
            --exit-code 1 infra/gcp
          trivy config --quiet --ignorefile .trivyignore --severity HIGH,CRITICAL \
            --exit-code 1 Dockerfile

      - name: Checkov -- Terraform (infra/gcp)
        if: always()
        run: |
          pipx run --spec "checkov==${CHECKOV_VERSION}" checkov --config-file .checkov.yaml -d infra/gcp \
            -o cli -o sarif --output-file-path console,checkov.sarif

      - name: Build the image (not pushed)
        if: always()
        run: docker build -t marginmaestro:scan .

      - name: Trivy -- image vulnerabilities and licences
        if: always()
        run: |
          trivy image --quiet --scanners vuln --ignore-unfixed --severity HIGH,CRITICAL \
            --format sarif --output trivy-image.sarif marginmaestro:scan
          # Python package licences, for the record (the gate above decides).
          trivy image --quiet --scanners license --pkg-types library \
            --severity HIGH,CRITICAL marginmaestro:scan
          trivy image --quiet --scanners vuln --ignore-unfixed --severity CRITICAL \
            --exit-code 1 marginmaestro:scan

      - name: Upload SARIF -- gitleaks
        if: always() && hashFiles('gitleaks.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

      - name: Upload SARIF -- Trivy config
        if: always() && hashFiles('trivy-config.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-config.sarif
          category: trivy-config

      - name: Upload SARIF -- Checkov
        if: always() && hashFiles('checkov.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: checkov.sarif
          category: checkov

      - name: Upload SARIF -- Trivy image
        if: always() && hashFiles('trivy-image.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

  sonarcloud:
    needs: lint-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8.0.1
        with:
          name: coverage-xml

      - name: SonarQube Cloud Scan
        uses: SonarSource/sonarqube-scan-action@v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: SonarQube Cloud Quality Gate Check
        uses: SonarSource/sonarqube-quality-gate-action@v1.2.0
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  build-and-push:
    needs: lint-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: docker/setup-buildx-action@v4.2.0

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4.5.1
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            adarshmurali/marginmaestro:latest
            adarshmurali/marginmaestro:${{ github.sha }}

  # Continuous deployment to Cloud Run (MM-126, MM-G57): every merge to main
  # deploys the image this run just pushed (tagged with the commit sha), then
  # smoke-tests it. Keyless login as mm-ci-sa via Workload Identity Federation
  # (MM-100); GCP only trusts this repo on main (infra/gcp/wif.tf). mm-ci-sa
  # can deploy this one service and act as mm-api-sa -- nothing else
  # (infra/gcp/cloud_run.tf). Only the image changes; env vars, scaling and
  # the Cloud SQL mount stay as Terraform set them.
  deploy-gcp:
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-gcp
      cancel-in-progress: false # never cut a rollout short; queue the next one
    permissions:
      contents: read
      id-token: write # lets the job request GitHub's OIDC token
    steps:
      - name: Authenticate to GCP (Workload Identity Federation)
        uses: google-github-actions/auth@v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v3.0.1
        with:
          service: marginmaestro-api
          region: us-central1
          project_id: marginmaestro-demo
          image: docker.io/adarshmurali/marginmaestro:${{ github.sha }}
          # Keep Terraform's labels; without this the action adds its own
          # (managed-by, commit-sha) and every plan shows a label diff.
          skip_default_labels: true

      - name: Smoke test
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          for path in health ready; do
            for attempt in 1 2 3 4 5 6; do
              code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 "$URL/$path") || code=000
              echo "/$path attempt $attempt -> $code"
              [ "$code" = "200" ] && break
              [ "$attempt" = "6" ] && exit 1
              sleep 10
            done
          done

      # MM-128: the read-only MCP servers run the same image. They're private
      # (IAM invoker: the desk assistant only), so there's no curl smoke test;
      # Cloud Run's /health startup probe fails the rollout instead. Gated on
      # MCP_CD_ENABLED, set once Terraform has created the services (their
      # first image must already contain mcp_servers.http).
      - name: Deploy MCP market-data
        if: vars.MCP_CD_ENABLED == 'true'
        uses: google-github-actions/deploy-cloudrun@v3.0.1
        with:
          service: mcp-market-data
          region: us-central1
          project_id: marginmaestro-demo
          image: docker.io/adarshmurali/marginmaestro:${{ github.sha }}
          skip_default_labels: true

      - name: Deploy MCP rag
        if: vars.MCP_CD_ENABLED == 'true'
        uses: google-github-actions/deploy-cloudrun@v3.0.1
        with:
          service: mcp-rag
          region: us-central1
          project_id: marginmaestro-demo
          image: docker.io/adarshmurali/marginmaestro:${{ github.sha }}
          skip_default_labels: true

      - name: Deploy MCP margin-status
        if: vars.MCP_CD_ENABLED == 'true'
        uses: google-github-actions/deploy-cloudrun@v3.0.1
        with:
          service: mcp-margin-status
          region: us-central1
          project_id: marginmaestro-demo
          image: docker.io/adarshmurali/marginmaestro:${{ github.sha }}
          skip_default_labels: true
