[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marginmaestro"
version = "0.1.0"
description = "Agentic, event-driven margin call lifecycle automation"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "structlog",
    "httpx",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-asyncio",
    "ruff",
    "black",
    "mypy",
    "pre-commit",
    "moto",
    "testcontainers[kafka]",
]
rag = ["chromadb-client", "mcp>=1.30,<2.0"]
streaming = ["confluent-kafka"]
llm = ["langgraph", "openai"]
data = ["yfinance", "pandas", "fredapi", "faker"]
db = ["sqlalchemy", "pyodbc", "alembic", "psycopg[binary]", "pgvector"]
aws = ["boto3"]
notify = ["slack-sdk"]
auth = ["bcrypt", "pyjwt"]
# gcp: runtime deps baked into the one app image (AWS + GCP, ground rule 6).
# adk: the desk assistant (MM-129) -- deployed to Agent Runtime, not in the app image.
# gcp-ops: tooling outside the app (billing kill-switch function), CI only.
gcp = ["google-cloud-secret-manager", "google-genai", "google-cloud-storage", "google-cloud-modelarmor", "google-cloud-dlp", "google-cloud-pubsub", "google-cloud-tasks"]
adk = ["google-adk>=2.11,<3", "google-cloud-aiplatform[agent-engines,evaluation]>=1.148.1,<2"]
gcp-ops = ["google-cloud-billing", "functions-framework"]
observability = [
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp-proto-http",
    "opentelemetry-exporter-gcp-trace",
    "prometheus-client",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom (`x: T = Depends(dep)`) is safe: Depends
# returns an immutable marker, not a shared mutable default.
extend-immutable-calls = ["fastapi.Depends"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
namespace_packages = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = "boto3.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "faker.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "yfinance.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "fredapi.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pandas.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "confluent_kafka.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["functions_framework.*", "cloudevents.*", "google.cloud.*", "google.genai.*", "google.api_core.*", "google.auth.*", "google.oauth2.*", "opentelemetry.exporter.cloud_trace.*", "pgvector.*", "google.adk.*", "vertexai.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: hits real external network APIs (yfinance, CoinGecko); excluded from default/CI runs",
]

[tool.coverage.run]
source = ["src"]
