repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff

  - repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
      - id: black

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.0
    hooks:
      - id: mypy
        files: ^src/
        args: [--config-file=pyproject.toml]
        additional_dependencies:
          - fastapi
          - pydantic
          - pydantic-settings
          - structlog
          - faker
          - sqlalchemy
          - httpx
          - yfinance
          - fredapi
          - pandas
          - chromadb
          - openai
          - mcp
